server {
    listen 80;
    server_name familienplan.example.de;
    root /opt/familienplan/frontend/dist;
    index index.html;
    client_max_body_size 20m;
    location /api/ { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    location / { try_files $uri $uri/ /index.html; }
}

